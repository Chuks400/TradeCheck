name: TradeCheck tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demo smoke test
        run: python evaluate_demo.py
      - name: Compile source
        run: python -m compileall -q app.py engine.py extended_review.py llm_review.py llm_live_smoke.py evaluation
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
